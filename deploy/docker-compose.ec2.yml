services:
  backend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
    restart: unless-stopped
    # Host networking allows the backend to bind solely to 127.0.0.1:8787 (behind Caddy)
    # while reaching the GPU worker over the EC2 host's tailscale0 interface (100.64.0.0/10).
    network_mode: host
    env_file:
      - ./env/backend.env
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    network_mode: host
    environment:
      - DOMAIN=${DOMAIN:?Set DOMAIN to your chosen hostname}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../mobile/build/web:/var/www/senior-meal-preview:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend

volumes:
  caddy_data:
  caddy_config:
