name: senior_meal_preview
description: A local, illustrative meal-change preview prototype. Not coursework submission.
publish_to: none
version: 0.7.0+9

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0
  image_picker: ^1.2.4
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/Roboto_LICENSE.txt
    - assets/meals/
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700

dependency_overrides:
  # 2.3+ builds native JNI code with the NDK, whose x86_64 clang cannot run on this aarch64
  # build host. 2.2.x uses plain Java (Pigeon) and does the same job.
  path_provider_android: ">=2.2.0 <2.3.0"
